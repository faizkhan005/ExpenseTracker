name: ExpenseTracker CI Build

on:
  push: 
   branches: [main]
   paths-ignore:
     - '**/*.md'
     - '**/*.gitignore'
     - '**/*.gitattributes'
  workflow_dispatch:
permissions: 
  contents: read
jobs:
  run-tests:
    runs-on: windows-latest
    name: Run Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore 

      - name: Run Tests
        run: dotnet test --configuration Release --no-restore --verbosity normal

  build-android:
    runs-on: windows-latest
    name: Android Build
    needs: run-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Workloads
        run: |
          dotnet workload install android --ignore-failed-sources
          dotnet workload install maui --ignore-failed-sources
          
      - name: Restore Dependencies
        run: dotnet restore 
        
      - name: Decode Android keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $path = "$env:GITHUB_WORKSPACE\myapp.keystore"
          $keystore = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($keystore))
          echo "KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
          
      - name: Publish MAUI Android
        run: dotnet publish ExpenseTracker/ExpenseTracker.csproj -f:net10.0-android -c:Release /p:AndroidSigningKeyStore="${{ env.KEYSTORE_PATH }}" /p:AndroidSigningKeyPass=${{secrets.keystorepassword}} /p:AndroidSigningStorePass=${{secrets.keystorepassword}}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: '**/bin/Release/net10.0-android/publish/*.apk'
