<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<!-- Smooth rounding for corners -->
		<clipPath id="iconBounds">
			<rect x="32" y="32" width="448" height="448" rx="96" ry="96" />
		</clipPath>
	</defs>

	<!-- App Icon Background (#1a1a2e) -->
	<rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#1a1a2e" />

	<!-- Main Graphic Container (clipping keeps internal elements safe) -->
	<g clip-path="url(#iconBounds)">

		<!-- Left Bar: Starting Budget Stack (#7F77DD) -->
		<rect x="180" y="270" width="36" height="90" rx="10" fill="#7F77DD" />

		<!-- Middle Bar: Growing / Transit Stack (#534AB7) -->
		<rect x="238" y="220" width="36" height="140" rx="10" fill="#534AB7" />

		<!-- Right Bar: Target Savings Stack (#1D9E75) -->
		<rect x="296" y="160" width="36" height="200" rx="10" fill="#1D9E75" />

		<!-- Trend Arrow Line Layer (#534AB7) -->
		<path d="M 140 310 L 210 210 L 270 245 L 350 135"
			  fill="none"
			  stroke="#534AB7"
			  stroke-width="16"
			  stroke-linecap="round"
			  stroke-linejoin="round" />

		<!-- Trend Arrow Head (#534AB7) -->
		<path d="M 315 130 L 356 128 L 354 169"
			  fill="none"
			  stroke="#534AB7"
			  stroke-width="16"
			  stroke-linecap="round"
			  stroke-linejoin="round" />

		<!-- Top Left Floating Element: Expense / Cost Downward Indicator (#E24B4A) -->
		<g transform="translate(140, 110)">
			<!-- Minus sign badge -->
			<circle cx="0" cy="0" r="16" fill="#E24B4A" />
			<line x1="-8" y1="0" x2="8" y2="0" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" />
			<!-- Small downward expense zigzag -->
			<path d="M 25 -15 L 45 -5 L 55 -25" fill="none" stroke="#E24B4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
			<path d="M 43 -27 L 57 -27 L 57 -13" fill="none" stroke="#E24B4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
		</g>

		<!-- Top Right Floating Element: Currency / Success Badge (#1D9E75 & #534AB7) -->
		<g transform="translate(365, 95)">
			<!-- Plus Action Icon -->
			<path d="M -5 25 L 11 25 M 3 17 L 3 33" fill="none" stroke="#1D9E75" stroke-width="6" stroke-linecap="round" />
			<!-- Dollar styling vector element -->
			<path d="M 25 -5 C 20 -5, 14 -2, 14 4 C 14 11, 30 9, 30 16 C 30 21, 24 23, 19 23 M 22 -10 L 22 28"
				  fill="none" stroke="#534AB7" stroke-width="7" stroke-linecap="round" />
		</g>

		<!-- Bottom Curved Graphic Anchor: Safe Upward Sub-Trend (#1D9E75) -->
		<path d="M 360 280 C 375 280, 385 265, 385 245" fill="none" stroke="#1D9E75" stroke-width="8" stroke-linecap="round" />
		<path d="M 374 240 L 387 243 L 389 256" fill="none" stroke="#1D9E75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

	</g>
</svg>
