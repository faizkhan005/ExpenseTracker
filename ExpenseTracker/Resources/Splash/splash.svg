<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<!-- Background Radial Glow -->
		<radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
			<stop offset="0%" stop-color="#2a2a4e" />
			<stop offset="60%" stop-color="#1a1a2e" />
			<stop offset="100%" stop-color="#111122" />
		</radialGradient>

		<!-- Glowing Purple for Upward Neon Arrow Path -->
		<linearGradient id="purpleNeon" x1="0%" y1="100%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#534AB7" />
			<stop offset="100%" stop-color="#7F77DD" />
		</linearGradient>

		<!-- Vibrant Mint/Green for Financial Growth and Success Nodes -->
		<linearGradient id="greenNeon" x1="0%" y1="100%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#1D9E75" />
			<stop offset="100%" stop-color="#2ee59d" />
		</linearGradient>

		<!-- Intense Red Core for Danger / Expense Foundation Base -->
		<linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ff6b6b" />
			<stop offset="100%" stop-color="#E24B4A" />
		</linearGradient>

		<!-- Neon Glow Effects Filter -->
		<filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="12" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>

		<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="25" result="blur" />
		</filter>
	</defs>

	<!-- Deep Canvas Dark Header Background Canvas Mapping -->
	<rect width="512" height="512" fill="url(#bgGlow)" />

	<!-- Ambient Backdrop Illumination Elements -->
	<circle cx="256" cy="230" r="140" fill="#534AB7" opacity="0.15" filter="url(#softGlow)" />
	<circle cx="340" cy="150" r="90" fill="#1D9E75" opacity="0.12" filter="url(#softGlow)" />

	<!-- Main Isometric Geometric Crest Framework -->
	<g transform="translate(0, -15)">

		<!-- Outer Cyber Ring Border Framework -->
		<circle cx="256" cy="245" r="145" fill="none" stroke="#534AB7" stroke-width="3" opacity="0.25" />
		<circle cx="256" cy="245" r="145" fill="none" stroke="url(#greenNeon)" stroke-width="4" stroke-dasharray="120 280" stroke-linecap="round" transform="rotate(-45 256 245)" filter="url(#neonGlow)" opacity="0.8" />

		<!-- Angular Metallic Crest Backdrop / Geometric Shadow Base -->
		<path d="M 256 105 L 376 175 L 376 315 L 256 385 L 136 315 L 136 175 Z" fill="#141424" opacity="0.9" stroke="#2a2a4e" stroke-width="2" />

		<!-- Lower Level Floor: Red Expense Valley Node Base Layer (#E24B4A) -->
		<path d="M 136 315 L 200 278 L 240 310 L 256 295 L 220 364 L 136 315 Z" fill="url(#redNeon)" opacity="0.85" />
		<!-- Deepest drop indicator light -->
		<circle cx="200" cy="278" r="7" fill="#ffffff" filter="url(#neonGlow)" />

		<!-- Tech Network Grid Intersect Lines (Circuit style detailing) -->
		<path d="M 160 200 L 210 230 M 210 230 L 210 300 M 210 230 L 290 185" fill="none" stroke="#534AB7" stroke-width="3" opacity="0.4" stroke-linecap="round" />
		<circle cx="210" cy="230" r="4" fill="#7F77DD" />
		<circle cx="290" cy="185" r="4" fill="#7F77DD" />

		<!-- Mid-Ground Data Bars Stack Framework System (Sleek Tech Bars) -->
		<!-- Left Mid-Bar (#7F77DD) -->
		<path d="M 230 330 L 250 318 L 250 250 L 230 262 Z" fill="#7F77DD" opacity="0.8" />
		<!-- Right Master Growth Bar (#1D9E75) -->
		<path d="M 262 348 L 282 336 L 282 210 L 262 222 Z" fill="url(#greenNeon)" filter="url(#neonGlow)" opacity="0.9" />

		<!-- Forefront Layer: Dynamic High-Glow Ascending Analytics Breakout Curve -->
		<!-- Main Neon Line Curve Running Upward -->
		<path d="M 155 270 L 225 210 L 285 255 L 360 140"
			  fill="none"
			  stroke="url(#purpleNeon)"
			  stroke-width="16"
			  stroke-linecap="round"
			  stroke-linejoin="round"
			  filter="url(#neonGlow)" />

		<!-- Core Overlay Light Highlight Layer for High Contrast Metallic Glass Feel -->
		<path d="M 155 270 L 225 210 L 285 255 L 360 140"
			  fill="none"
			  stroke="#ffffff"
			  stroke-width="4"
			  stroke-linecap="round"
			  stroke-linejoin="round"
			  opacity="0.6" />

		<!-- Futuristic Sharp Arrow Head Vector -->
		<path d="M 315 136 L 364 136 L 364 185"
			  fill="none"
			  stroke="url(#purpleNeon)"
			  stroke-width="16"
			  stroke-linecap="round"
			  stroke-linejoin="round"
			  filter="url(#neonGlow)" />
		<path d="M 322 140 L 360 140 L 360 178"
			  fill="none"
			  stroke="#ffffff"
			  stroke-width="4"
			  stroke-linecap="round"
			  stroke-linejoin="round"
			  opacity="0.7" />

		<!-- Top Target Financial Destination Floating Node Ring -->
		<circle cx="340" cy="100" r="18" fill="none" stroke="url(#greenNeon)" stroke-width="5" filter="url(#neonGlow)" />
		<circle cx="340" cy="100" r="6" fill="#ffffff" filter="url(#neonGlow)" />

		<!-- Floating Spark Tech Accent Orbs -->
		<circle cx="175" cy="140" r="5" fill="#7F77DD" filter="url(#neonGlow)" />
		<circle cx="370" cy="240" r="4" fill="#1D9E75" filter="url(#neonGlow)" />

	</g>
</svg>
